<svg width="13" height="13" viewBox="0 0 13 13" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square frame -->
  <rect x="0.5" y="0.5" width="12" height="12" rx="3" ry="3" fill="none" stroke="#DC6D4B" stroke-width="1.2"/>
  <!-- Clock circle -->
  <circle cx="6.5" cy="6.5" r="3.5" fill="none" stroke="#DC6D4B" stroke-width="1"/>
  <!-- Clock hands -->
  <line x1="6.5" y1="6.5" x2="6.5" y2="4.2" stroke="#DC6D4B" stroke-width="1" stroke-linecap="round"/>
  <line x1="6.5" y1="6.5" x2="8.3" y2="7.3" stroke="#DC6D4B" stroke-width="1" stroke-linecap="round"/>
</svg>
